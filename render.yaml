services:
  - type: web
    name: mcq-generator
    runtime: docker
    plan: starter
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: GCP_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_OCR_MODELS
        value: gemini-3.6-flash
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: SAMBANOVA_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OCR_PROVIDER_ORDER
        value: tesseract,mistral,openrouter,gemini
      - key: LOCAL_OCR_ENABLED
        value: "true"
      - key: LOCAL_OCR_LANG
        value: eng
      - key: LOCAL_OCR_TIMEOUT_SECONDS
        value: "90"
      - key: LOCAL_OCR_MIN_TEXT_CHARS
        value: "120"
      - key: MISTRAL_OCR_ENABLED
        value: "true"
      - key: MISTRAL_OCR_MODEL
        value: mistral-ocr-latest
      - key: OPENROUTER_OCR_ENABLED
        value: "false"
      - key: OPENROUTER_OCR_MODEL
        sync: false
      - key: GEMINI_OCR_ENABLED
        value: "true"
      - key: DAILY_QUOTA_COOLDOWN_SECONDS
        value: "21600"
      - key: MAX_PDF_MB
        value: "120"
      - key: OCR_DPI
        value: "96"
      - key: OCR_TIMEOUT_SECONDS
        value: "240"
      - key: WORKER_LEASE_SECONDS
        value: "300"
      - key: MAX_PAGE_ATTEMPTS
        value: "3"
