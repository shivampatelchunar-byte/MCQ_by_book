services:
  - type: web
    name: mcq-generator
    runtime: python
    plan: starter
    autoDeploy: true
    buildCommand: pip install --no-cache-dir -r requirements.txt
    # The application includes its own background worker: keep exactly one Uvicorn worker.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: MONGO_URI
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: GCP_SERVICE_ACCOUNT_JSON
        sync: false
      # Preferred comma-separated credential/model configuration.
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_OCR_MODELS
        value: gemini-3.6-flash
      # Legacy names are still accepted by main.py; remove them after migration if unused.
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: SAMBANOVA_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MAX_PDF_MB
        value: "80"
      - key: OCR_DPI
        value: "120"
      - key: OCR_TIMEOUT_SECONDS
        value: "180"
      - key: WORKER_LEASE_SECONDS
        value: "300"
      - key: MAX_PAGE_ATTEMPTS
        value: "3"
